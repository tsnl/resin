[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[project]
name = "setup"
version = "0.1.0"
description = "Local setup helper for the project"
requires-python = ">=3.10"
dependencies = ["rich", "requests"]

[project.scripts]
setup = "setup.cli:main"

[tool.uv.build-backend]
module-name = "setup"
module-root = ""
