[package]
name = "resin-lsp"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
description = "Language server for Resin"
repository = "https://github.com/tsnl/resin"

[dependencies]
arc-swap = { workspace = true }
resin-lir = { workspace = true }
resin-codegen = { workspace = true }
resin-toolchain = { workspace = true }
resin-source = { workspace = true }
resin-ast = { workspace = true }
resin-cache = { workspace = true }
resin-executor = { workspace = true }
tokio = { workspace = true }
resin-hir = { workspace = true }
resin-cst = { workspace = true }
lsp-server = "0.7.9"
lsp-types = "0.97"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
tempfile = { workspace = true }
resin-runtime = { workspace = true }
