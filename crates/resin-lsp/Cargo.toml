[package]
name = "resin-lsp"
version.workspace = true
edition = "2024"
publish = false
description = "Language server for Resin"
repository = "https://github.com/tsnl/resin"

[dependencies]
resin-compiler = { workspace = true }
resin-hir = { workspace = true }
resin-common = { workspace = true }
resin-cst = { workspace = true }
lsp-server = "0.7.9"
lsp-types = "0.97"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
