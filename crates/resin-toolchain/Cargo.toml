[package]
name = "resin-toolchain"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true

[dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
resin-executor = { workspace = true }
blake3 = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clang-sys = { version = "1.9", features = ["runtime", "clang_8_0"] }
libloading = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
