[package]
name = "resin-runtime"
version.workspace = true
edition = "2024"
publish = false

[features]
test-support = []

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
ash = { version = "0.38", default-features = false, features = ["loaded", "std"] }
glfw-sys = { version = "8", default-features = false, features = ["src-build", "vulkan"] }
libc = "0.2"
png = "0.17"

[target.'cfg(target_os = "linux")'.dependencies]
glfw-sys = { version = "8", default-features = false, features = ["x11", "wayland"] }

[[test]]
name = "compute"
required-features = ["test-support"]

[[test]]
name = "hello_triangle"
required-features = ["test-support"]

[[test]]
name = "synchronization"
required-features = ["test-support"]
