[package]
name = "resin-server"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true

[dependencies]
resin-protocol = { workspace = true }
resin-source = { workspace = true }
resin-types = { workspace = true }
resin-cst = { workspace = true }
resin-ast = { workspace = true }
resin-hir = { workspace = true }
resin-lir = { workspace = true }
resin-codegen = { workspace = true }
resin-runtime = { workspace = true }
resin-toolchain = { workspace = true }
resin-cache = { workspace = true }
resin-executor = { workspace = true }
arc-swap = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
tempfile = { workspace = true }
log = { workspace = true }
blake3 = { workspace = true }
axum = "0.8"
tokio-util = { version = "0.7", features = ["io"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
http-body-util = "0.1"
