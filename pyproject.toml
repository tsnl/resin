[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[project]
name = "zero"
version = "0.1.0"
description = ""
authors = [{ name = "Nikhil Idiculla", email = "nikhil.idiculla@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "vulkan>=1.3.275.1,<2.0.0.0",
    "glfw>=2.10.0,<3.0.0",
    "torch>=2.9.1",
    "numpy",                      # we don't use this directly, but torch needs it
]

[project.optional-dependencies]
dev = ["pyright (>=1.1.407,<2.0.0)", "pytest (>=9.0.1,<10.0.0)"]

[project.scripts]
zero-replay = "zero.app.zero_replay:main"

[tool.ruff]
line-length = 88

[tool.uv.build-backend]
module-name = "zero"
module-root = ""

[dependency-groups]
dev = [
    "pyright>=1.1.407",
    "ruff>=0.14.5",
]
