[build-system]
requires = ["setuptools>=42", "wheel", "nuitka", "toml", "uv"]
build-backend = "nuitka.distutils.Build"

[project]
name = "zero"
version = "0.1.0"
description = ""
authors = [{ name = "Nikhil Idiculla", email = "nikhil.idiculla@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "vulkan>=1.3.275.1,<2.0.0.0",
    "glfw>=2.10.0,<3.0.0",
    "torch>=2.9.1",
    "numpy",
]

[project.scripts]
zero-replay = "zero.app.zero_replay:main"

[tool.ruff]
line-length = 88

[tool.nuitka.distutils]
module-name = "zero"
module-root = ""

[tool.nuitka]
# ...

[project.optional-dependencies]
dev = [
    "pyright>=1.1.407",
    "ruff>=0.14.5",
    "pytest>=9.0.1,<10.0.0",
    "rich",
    "requests",
]
