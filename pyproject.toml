[project]
name = "zfw"
version = "0.1.0"
description = "A game engine for fun and profit, written in Python."
readme = "README.md"
authors = [{ name = "Nikhil Idiculla", email = "nikhil.idiculla@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "glfw>=2.10.0,<3.0.0",
    "kiwisolver>=1.4.9",
    "rich>=14.2.0",
    "pygltflib>=1.16.0",
    "pydantic>=2.12.5",
    "wgpu>=0.19.0",
    "numba>=0.63.1",
    "numpy-quaternion>=2024.0.13",
    "pillow>=12.1.0",
]

[project.optional-dependencies]
dev = [
    "invoke>=2.2.1",
    "pyright>=1.1.407",
    "ruff>=0.14.5",
    "pytest>=9.0.1,<10.0.0",
    "pytest-profiling>=1.8.1",
    "rich",
    "requests",
    "scikit-image",
    "ipykernel>=7.1.0",
    "flameprof>=0.4",
    "click>=8.3.1",
]

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0", "uv"]
build-backend = "uv_build"

[tool.uv.build-backend]
package-data = { "zfw" = ["bundled_data/**/*", "*.wgsl"] }

[tool.uv.workspace]
members = ["apps/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

#
# Ruff configuration
#

[tool.ruff.lint]
extend-select = [
    # unsorted dunder all
    "RUF022",

    # import-outside-top-level
    "PLC0415",
]
ignore = [
    # Syntax error in forward annotation (for JaxTyping)
    "F722",
]
