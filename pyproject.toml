[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "zero"
version = "0.1.0"
description = ""
authors = [{ name = "Nikhil Idiculla", email = "nikhil.idiculla@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["vulkan (>=1.3.275.1,<2.0.0.0)", "glfw (>=2.10.0,<3.0.0)"]

[project.optional-dependencies]
dev = ["pyright (>=1.1.407,<2.0.0)", "pytest (>=9.0.1,<10.0.0)"]

[project.scripts]
zero-replay = "zero.app.zero_replay:main"

[tool.ruff]
line-length = 88
