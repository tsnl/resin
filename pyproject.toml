[build-system]
requires = ["uv_build>=0.9.10,<0.10.0", "uv"]
build-backend = "uv_build"

[project]
name = "zero"
version = "0.1.0"
description = ""
authors = [{ name = "Nikhil Idiculla", email = "nikhil.idiculla@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "vulkan>=1.3.275.1,<2.0.0.0",
    "glfw>=2.10.0,<3.0.0",
    "torch>=2.9.1",
    "numpy",
]

[project.scripts]
zero-sandbox = "zero.app.zero_sandbox:main"

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "*_copy.py", "*_triangle.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.uv.build-backend]
module-name = "zero"
module-root = ""
package-data = { "zero" = ["bundled_data/**/*"] }

[tool.nuitka]
# ...

[project.optional-dependencies]
dev = [
    "pyright>=1.1.407",
    "ruff>=0.14.5",
    "pytest>=9.0.1,<10.0.0",
    "rich",
    "requests",
    "pillow>=10.0.0",
]
