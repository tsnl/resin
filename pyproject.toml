[project]
name = "resin"
version = "0.1.0"
description = "Resin GPGPU metaprogramming"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Nikhil Idiculla", email = "nikhil.idiculla@gmail.com" }]
dependencies = [
    "frozendict>=2.4.7",
    "msgpack>=1.1.2",
    "resin-rt-pybind",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.8",
    "clang>=21.1.7",
    "pytest>=9.0.2",
    "rich>=14.3.2",
    "ruff>=0.14.14",
    "torch>=2.12.1",
]

[build-system]
requires = ["uv_build>=0.9.14,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "resin"
module-root = "src"

[tool.uv.sources]
resin-rt-pybind = { workspace = true }

[tool.uv.workspace]
members = [
    ".",
    "crates/resin-rt-pybind",
]

[tool.basedpyright]
pythonVersion = "3.14"

# node.py <-> view.py: View is only imported under TYPE_CHECKING in node.py.
reportImportCycles = false

# Any is used a lot, e.g. for `getattr()`, so this lets us avoid a lot of unnecessary
# casts to `object`.
reportAny = false
reportExplicitAny = false

executionEnvironments = [
    { root = "examples" },
]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["E4", "F"]
extend-select = ["PLC2701"]
