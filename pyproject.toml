[project]
name = "zfw"
version = "0.1.0"
description = "A game engine for fun and profit, written in Python."
readme = "README.md"
authors = [{ name = "Nikhil Idiculla", email = "nikhil.idiculla@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "vulkan>=1.3.275.1,<2.0.0.0",
    "glfw>=2.10.0,<3.0.0",
    "numpy>=2.3.5,<3.0.0",
    "pillow>=12.0.0",
    "uharfbuzz>=0.53.0",
    "kiwisolver>=1.4.9",
    "rich>=14.2.0",
    "pygltflib>=1.16.0",
    "pydantic>=2.12.5",
    "msgpack>=1.1.2",
    "orjson>=3.11.5",
    "wgpu>=0.19.0",
    "jaxtyping>=0.3.4",
    "numba>=0.63.1",
    "typeguard>=4.4.4",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.407",
    "ruff>=0.14.5",
    "pytest>=9.0.1,<10.0.0",
    "pytest-profiling>=1.8.1",
    "rich",
    "requests",
    "pillow>=10.0.0",
    "scikit-image",
    "ipykernel>=7.1.0",
    "flameprof>=0.4",
]

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0", "uv"]
build-backend = "uv_build"

[tool.uv.build-backend]
package-data = { "zfw" = ["bundled_data/**/*", "*.wgsl"] }

[tool.uv.workspace]
members = ["apps/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

#
# Ruff configuration
#

[tool.ruff.lint]
extend-select = [
    # unsorted dunder all
    "RUF022",

    # import-outside-top-level
    "PLC0415",
]
ignore = [
    # Syntax error in forward annotation (for JaxTyping)
    "F722",
]
