[project]
name = "zfw"
version = "0.1.0"
description = ""
authors = [{ name = "Nikhil Idiculla", email = "nikhil.idiculla@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "vulkan>=1.3.275.1,<2.0.0.0",
    "glfw>=2.10.0,<3.0.0",
    "numpy>=2.3.5,<3.0.0",
    "zfw_core",
    "zfw_sandbox",
]

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0", "uv"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.uv.workspace]
members = ["modules/zfw_build", "modules/zfw_core", "modules/zfw_sandbox"]

[tool.uv.sources]
zfw_build = { workspace = true }
zfw_core = { workspace = true }
zfw_sandbox = { workspace = true }

[project.optional-dependencies]
dev = [
    "pyright>=1.1.407",
    "ruff>=0.14.5",
    "pytest>=9.0.1,<10.0.0",
    "rich",
    "requests",
    "pillow>=10.0.0",
]
