[workspace]
members = ["crates/*"]
default-members = ["crates/resin"]
exclude = ["editors/zed"]
resolver = "3"

# Keep GLFW on the release CRT, matching Rust even in debug builds.
[profile.dev.package.glfw-sys]
opt-level = 1

[workspace.dependencies]
sexpfmt = "2"
tree-sitter = "0.27"
tree-sitter-resin = { path = "crates/tree-sitter-resin" }
resin = { path = "crates/resin" }
resin-runtime = { path = "crates/runtime" }
resin-common = { path = "crates/common" }
resin-cst = { path = "crates/cst" }
resin-ast = { path = "crates/ast" }
resin-hir = { path = "crates/hir" }
resin-lir = { path = "crates/lir" }
resin-lir-verifier = { path = "crates/lir-verifier" }
resin-codegen = { path = "crates/codegen" }
