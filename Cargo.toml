[package]
name = "zero"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/*", "."]

[lib]
name = "zero"
crate-type = ["cdylib"]

[dependencies]
zero-prelude = { path = "crates/zero-prelude" }
zero-gpu = { path = "crates/zero-gpu" }
zero-window = { path = "crates/zero-window" }
zero-render = { path = "crates/zero-render" }
pyo3 = "0.27.0"
paste = "1.0.15"
