[package]
name = "resin"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "crates/resin-runtime"]
resolver = "3"

[lib]
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
sexpfmt = "2"
tree-sitter = "0.25"
tree-sitter-resin = { path = "tree-sitter-resin" }
