[package]
name = "resin"
version = "0.1.0"
edition = "2024"

[features]
default = ["wgpu"]
wgpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
resin-macros = { path = "crates/resin-macros" }
thiserror = "2"
wgpu = { version = "24", optional = true }
pollster = { version = "0.4", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
naga = { version = "24", features = ["wgsl-in"] }

[[bench]]
name = "mnist_train"
harness = false

[workspace]
members = ["crates/resin-macros"]
resolver = "3"
