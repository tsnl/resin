[package]
name = "resin"
version = "0.1.0"
edition = "2024"

[features]
default = ["cpu", "wgpu", "vulkan"]
cpu = ["resin-jit/cpu"]
wgpu = ["resin-jit/wgpu"]
vulkan = ["resin-jit/vulkan"]

[dependencies]
resin-core = { path = "crates/resin-core" }
resin-dataset = { path = "crates/resin-dataset" }
resin-dsl = { path = "crates/resin-dsl" }
resin-jit = { path = "crates/resin-jit" }
resin-macros = { path = "crates/resin-macros" }
resin-render = { path = "crates/resin-render" }

[[example]]
name = "demo_front"
path = "examples/demo_front.rs"

[[example]]
name = "interp_add"
path = "examples/interp_add.rs"
required-features = ["cpu"]

[[example]]
name = "train_mnist"
path = "examples/train_mnist.rs"
# Needs at least one of `cpu` / `wgpu` (selected at runtime via --backend).

[[example]]
name = "mnist_profile"
path = "examples/mnist_profile.rs"
required-features = ["cpu"]

[[example]]
name = "demo_pathtrace"
path = "examples/demo_pathtrace.rs"
# Needs at least one of `cpu` / `wgpu` / `vulkan` (selected via --backend).

[[example]]
name = "demo_raster"
path = "examples/demo_raster.rs"
# Needs at least one of `cpu` / `wgpu` / `vulkan` (selected via --backend).

[workspace]
members = ["crates/*"]
resolver = "3"
