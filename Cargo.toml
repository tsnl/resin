[package]
name = "resin"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "resin-runtime", "tree-sitter-resin"]
resolver = "3"

[lib]
path = "src/lib.rs"

[features]
gpu = []

[dependencies]
clap = { version = "4", features = ["derive"] }
sexpfmt = "2"
tree-sitter = "0.27"
tree-sitter-resin = { path = "tree-sitter-resin" }
resin-runtime = { path = "resin-runtime" }
