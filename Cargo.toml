[package]
name = "resin"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = [".", "resin-runtime", "tree-sitter-resin", "resin-lsp", "crates/*"]
exclude = ["zed-resin"]
resolver = "3"

[lib]
path = "src/lib.rs"

[features]
gpu = []

[dependencies]
clap = { version = "4", features = ["derive"] }
resin-runtime = { path = "resin-runtime" }
resin-common = { workspace = true }
resin-cst = { workspace = true }
resin-ast = { workspace = true }
resin-hir = { workspace = true }
resin-lir = { workspace = true }
resin-lir-verifier = { workspace = true }
resin-codegen = { workspace = true }

[dev-dependencies]
tree-sitter = { workspace = true }
tree-sitter-resin = { workspace = true }

# Keep GLFW on the release CRT, matching Rust even in debug builds.
[profile.dev.package.glfw-sys]
opt-level = 1

[workspace.dependencies]
sexpfmt = "2"
tree-sitter = "0.27"
tree-sitter-resin = { path = "tree-sitter-resin" }
resin-common = { path = "crates/common" }
resin-cst = { path = "crates/cst" }
resin-ast = { path = "crates/ast" }
resin-hir = { path = "crates/hir" }
resin-lir = { path = "crates/lir" }
resin-lir-verifier = { path = "crates/lir-verifier" }
resin-codegen = { path = "crates/codegen" }
