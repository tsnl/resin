name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grammar:
    name: Grammar checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: tree-sitter-resin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tree-sitter-resin/package-lock.json
      - name: Install grammar check dependencies
        run: npm ci --ignore-scripts
      - name: Check grammar types
        run: npm run typecheck
      - name: Lint grammar
        run: npm run lint
      - name: Check grammar formatting
        run: npm run format:check

  native:
    needs: grammar
    strategy:
      fail-fast: false
      matrix:
        # Reserve the full platform matrix for manually requested release checks.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-24.04", "windows-2022", "macos-14"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libwayland-dev libxkbcommon-dev wayland-protocols glslc mesa-vulkan-drivers
      - name: Select the Linux software Vulkan driver
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for icd in /usr/share/vulkan/icd.d/lvp_icd*.json; do
            test -f "$icd"
            echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
            break
          done
      - name: Windows C toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installation = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$installation\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          foreach ($name in 'PATH', 'INCLUDE', 'LIB', 'LIBPATH') {
            "$name=$([Environment]::GetEnvironmentVariable($name))" >> $env:GITHUB_ENV
          }
          "$env:ProgramFiles\LLVM\bin" >> $env:GITHUB_PATH
      - name: Build compiler, runtime, and language server
        run: cargo build --workspace --locked
      - name: Check example formatting
        run: cargo run --locked -- --format --check examples
      - name: Runtime native libraries
        run: cargo rustc -p resin-runtime --lib -- --print native-static-libs
      - name: Run a host program
        run: cargo run --locked -- examples/eg001.resin
      - name: Test without opening windows
        env:
          RESIN_REQUIRE_GLSLC: ${{ runner.os == 'Linux' && '1' || '0' }}
          RESIN_REQUIRE_GPU: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: cargo test --workspace --all-features --locked --no-fail-fast -- --skip windows_present_resize_and_release_resources --skip resin_window_example_uses_bundled_glfw --skip resin_particles_example_computes_and_presents
      - name: Lint
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
