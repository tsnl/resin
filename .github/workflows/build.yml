name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grammar:
    name: Grammar checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: tree-sitter-resin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tree-sitter-resin/package-lock.json
      - name: Install grammar check dependencies
        run: npm ci --ignore-scripts
      - name: Check grammar types
        run: npm run typecheck
      - name: Lint grammar
        run: npm run lint
      - name: Check grammar formatting
        run: npm run format:check

  native:
    needs: grammar
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libwayland-dev libxkbcommon-dev wayland-protocols glslc
      - name: Build compiler, runtime, and language server
        run: cargo build --workspace --locked
      - name: Check example formatting
        run: cargo run --locked -- --format --check examples
      - name: Runtime native libraries
        run: cargo rustc -p resin-runtime --lib -- --print native-static-libs
      - name: Run a host program
        run: cargo run --locked -- examples/eg001.resin
      - name: Test without opening windows
        run: cargo test --workspace --all-features --locked --no-fail-fast -- --skip windows_present_resize_and_release_resources --skip resin_window_example_uses_bundled_glfw --skip resin_particles_example_computes_and_presents
      - name: Lint
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
