name: Build

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  grammar:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Grammar checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: crates/tree-sitter-resin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/tree-sitter-resin/package-lock.json
      - name: Install grammar check dependencies
        run: npm ci --ignore-scripts
      - name: Check grammar formatting
        run: npm run format:check
      - name: Lint grammar
        run: npm run lint
      - name: Check grammar types
        run: npm run typecheck

  native:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    env:
      # Keep assertions and overflow checks, but avoid generating and repeatedly
      # linking debug symbols into the test programs' static runtime archive.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    strategy:
      fail-fast: false
      matrix:
        # Reserve the full platform matrix for manually requested release checks.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-24.04", "windows-2022", "macos-14"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Linux dependencies and Rust toolchain
        if: runner.os == 'Linux'
        run: |
          # Rustup installs the pinned toolchain on first use. Overlap that
          # download with apt instead of waiting for the Rust cache step.
          rustc --version &
          toolchain_pid=$!
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libwayland-dev libxkbcommon-dev wayland-protocols glslc mesa-vulkan-drivers
          wait "$toolchain_pid"
      - name: Select the Linux software Vulkan driver
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for icd in /usr/share/vulkan/icd.d/lvp_icd*.json; do
            test -f "$icd"
            echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
            break
          done
      - name: macOS native build tools
        if: runner.os == 'macOS'
        run: brew install ninja shaderc
      - name: Windows Ninja
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja --yes --no-progress
      - name: Windows C toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installation = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$installation\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          foreach ($name in 'PATH', 'INCLUDE', 'LIB', 'LIBPATH') {
            "$name=$([Environment]::GetEnvironmentVariable($name))" >> $env:GITHUB_ENV
          }
          "$env:ProgramFiles\LLVM\bin" >> $env:GITHUB_PATH
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.os }}
          cache-bin: false
      # Fail on lint before paying for executable builds and test execution.
      # Keep the default success() condition so earlier failures stop this job.
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build compiler, runtime, and language server
        run: cargo build --workspace --all-features --locked
      - name: Check example formatting
        shell: bash
        run: ./target/debug/resin --format --check examples
      # Nextest does not run rustdoc tests. Check these before integration tests.
      - name: Test documentation
        run: cargo test --workspace --all-features --locked --doc
      - name: Run a host program
        shell: bash
        run: ./target/debug/resin examples/eg001.resin
      - name: Install test runner
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: cargo-nextest@0.9.143
      - name: Test without opening windows
        env:
          RESIN_TEST_PARTICLE_COUNT: 10000
          RESIN_REQUIRE_GLSLC: ${{ runner.os == 'Linux' && '1' || '0' }}
          RESIN_REQUIRE_GPU: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: cargo nextest run --workspace --all-features --locked --no-fail-fast -- --skip windows_present_resize_and_release_resources --skip resin_window_example_uses_bundled_glfw --skip resin_particles_example_computes_and_presents
      # This diagnostic changes Cargo's runtime build flags; keep it last to
      # avoid forcing a second runtime build before tests.
      - name: Runtime native libraries
        run: cargo rustc -p resin-runtime --lib --locked -- --print native-static-libs
