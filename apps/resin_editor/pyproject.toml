[project]
name = "resin_editor"
version = "0.1.0"
description = "Editor application for the Resin SDK."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["resin"]

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0", "uv"]
build-backend = "uv_build"

[project.scripts]
resin-editor = "resin_editor.resin_editor_cli:main"

[tool.uv.sources]
resin = { workspace = true }
