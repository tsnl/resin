[project]
name = "zfw_core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Nikhil Idiculla", email = "nikhil.idiculla@gmail.com" }]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling", "zfw_build"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["zfw_core/bundled_data/**/*"]

[tool.hatch.build.hooks.custom]
path = "build.py"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "build.py" },
    { file = "tests/**/*.py" },
    { file = "**/*.slang" },
    { file = "**/*.spv" },
]
